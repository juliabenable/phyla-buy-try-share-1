  if (x('.bts-x') || (e.target.classList && e.target.classList.contains('bts-scrim'))) { closeModal(); return; }
  if ((el = x('[data-nav]'))) { e.preventDefault(); toast(el.dataset.nav === 'soon' ? 'Coming soon' : 'Not part of this prototype'); return; }
  if (x('a[href="#"]')) e.preventDefault();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
render();
</script>
</body>
