<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buy, Try, Share · Creator flow v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Tokens transcribed from Figma "Design Labs" (Onboarding 1960 + 1974) and the Benable Mobile design library. */
:root {
  --text: #1c1c1c; --text-2: #222; --medium: #717171; --soft: #6a6a6a; --subtle: #aaa;
  --line: #e3e3e3; --line-2: #ddd; --weak: #f1f1f1; --page: #f9fafb; --white: #fff;
  --accent: #7a5cfa; --accent-press: #664bd7; --accent-weak: #edeaf9; --pink: #c05ff0;
  --green: #18906c; --green-bg: #effbf7;
  --sh-light: 0 4px 24px rgba(0,0,0,.08); --sh-medium: 0 16px 40px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, -apple-system, "SF Pro Text", "Segoe UI", sans-serif; color: var(--text); background: #ececef; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }

/* ---------- workbench ---------- */
.bench { min-height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.rail { padding: 28px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid #dcdce0; background: #f6f6f8; }
.rail h1 { font-size: 15px; font-weight: 600; margin: 0 8px 2px; }
.rail .sub { font-size: 12px; color: var(--medium); margin: 0 8px 14px; line-height: 16px; }
.rail button.s { display: flex; gap: 10px; align-items: baseline; padding: 8px; border-radius: 8px; font-size: 13px; color: #555; width: 100%; }
.rail button.s span { font-variant-numeric: tabular-nums; color: var(--subtle); font-size: 11px; width: 12px; }
.rail button.s[aria-current="true"] { background: var(--white); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.rail .links { margin-top: auto; display: grid; gap: 6px; padding: 12px 8px 0; font-size: 12px; }
.rail .links a { color: var(--medium); text-decoration: none; }
.rail .links a:hover { color: var(--text); }
.stage { display: grid; place-items: center; padding: 28px 16px; }
@media (max-width: 760px) { .bench { grid-template-columns: 1fr; } .rail { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid #dcdce0; padding: 12px; } .rail h1, .rail .sub, .rail .links { display: none; } .rail button.s { width: auto; } }

/* ---------- device ---------- */
.device { width: 375px; height: 812px; border-radius: 44px; background: var(--white); position: relative; overflow: hidden; box-shadow: 0 0 0 10px #111, 0 0 0 11px #2c2c2e, 0 30px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; }
.statusbar { height: 54px; flex: none; background: var(--white); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 32px 11px 40px; font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
.statusbar .ic { display: flex; align-items: center; gap: 6px; }
.hdr { height: 48px; flex: none; background: var(--white); display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; }
.hdr .t { text-align: center; font-size: 14px; font-weight: 600; }
.hdr .ib { width: 32px; height: 32px; display: grid; place-items: center; margin-left: 12px; border-radius: 8px; }
.hdr .ib.r { margin: 0 12px 0 auto; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.home { height: 21px; flex: none; position: relative; }
.home::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 100px; background: #000; }

/* ---------- 1. campaigns (Figma 1960) ---------- */
.pg { background: var(--page); }
.tabs { margin: 16px 16px 0; background: var(--weak); border-radius: 12px; padding: 4px; display: flex; gap: 8px; }
.tabs b { flex: 1; height: 32px; display: grid; place-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--medium); }
.tabs b.on { background: var(--white); color: var(--text); box-shadow: inset 0 0 0 .5px var(--line), 0 4px 12px rgba(0,0,0,.08); }
.tile { margin: 22px 16px 0; border-radius: 16px; box-shadow: inset 0 0 0 .5px var(--line); padding-bottom: 8px; position: relative; overflow: hidden; display: block; width: 343px; }
.tile--bts { background: #b79cf2 url(m/tile-bg.jpg) center / cover; }
.tile--pair { background: linear-gradient(88deg, rgba(204,161,247,.12) 7%, rgba(215,164,222,.12) 48%, rgba(234,169,178,.12) 95%), #fff; margin-top: 45px; margin-bottom: 40px; }
.tile-h { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.tile-logo { width: 48px; height: 48px; border-radius: 50%; background: #fff; box-shadow: var(--sh-light); display: grid; place-items: center; flex: none; overflow: hidden; }
.tile-logo img { width: 85%; display: block; }
.tile-h .nm { font-size: 16px; font-weight: 700; flex: 1; }
.tile--bts .nm { color: #fff; }
.chip-bts { background: #e4ffa9; color: #1c8857; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.08); white-space: nowrap; }
.tile-c { margin: 0 8px; background: #fff; border-radius: 12px; padding: 12px; box-shadow: var(--sh-medium); display: grid; gap: 20px; }
.tile-c .txt { display: grid; gap: 6px; font-size: 14px; line-height: 17px; }
.tile-c .txt b { font-weight: 600; color: var(--text-2); }
.tile-c .txt span { color: var(--medium); }
.chip-cash { background: #daf7ed; box-shadow: inset 0 0 0 .5px #cae0d6; border-radius: 8px; padding: 10px 12px; text-align: center; font-size: 16px; font-weight: 600; color: #196249; margin-bottom: 2px; }
.founder { display: flex; align-items: center; gap: 12px; }
.founder img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.founder b { display: block; font-size: 13px; font-weight: 600; color: #1a1a1a; }
.founder span { font-size: 11px; color: #8a8a8a; }
.pillbtn { height: 41px; border-radius: 40px; display: grid; place-items: center; font-size: 14px; font-weight: 500; background: var(--accent); color: #fff; width: 100%; }
.pillbtn.o { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- 2. opportunity (Figma 1974) ---------- */
.opp { padding: 16px 16px 24px; }
.shot { width: 231px; height: 219px; margin: 0 auto; border-radius: 16px; box-shadow: inset 0 0 0 .5px var(--line), 0 18px 16px -4px rgba(0,0,0,.05); overflow: hidden; position: relative; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot::after { content: ""; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 0 .5px var(--line); }
.opp-t { text-align: center; margin: 24px 14px 0; display: grid; gap: 8px; }
.opp-t h2 { margin: 0; font-size: 20px; line-height: 24px; font-weight: 700; }
.opp-t p { font-size: 14px; line-height: 17px; color: var(--medium); }
.chip-cash s { font-weight: 500; opacity: .6; } .chip-cash b { font-weight: 700; }
.tile--bts .tile-c { gap: 16px; padding: 12px; }
.tprod { display: flex; align-items: center; gap: 12px; }
.tprod img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; box-shadow: 0 0 0 .5px var(--line); flex: none; }
.tprod div { display: grid; gap: 4px; min-width: 0; }
.tprod b { font-size: 16px; line-height: 20px; font-weight: 600; color: var(--text-2); }
.tpr { font-size: 14px; line-height: 18px; color: var(--text-2); } .tpr b { font-size: 14px; line-height: 18px; font-weight: 700; } .tpr s { color: var(--medium); }
.tdesc { font-size: 14px; line-height: 20px; color: var(--medium); }
.tprod div { gap: 6px; } .tprod b { font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -.1px; }
.tpr { color: var(--medium); } .tprod .tpr { font-size: 16px; line-height: 20px; margin-top: 2px; } .tprod .tpr b { color: var(--text-2); letter-spacing: 0; font-size: 16px; line-height: 20px; }
.tsub { font-size: 13px; line-height: 17px; color: var(--medium); }
.thead { display: grid; gap: 4px; } .thead-r { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.thead-r > b { font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -.1px; color: var(--text-2); min-width: 0; }
.thead-r .tpr { font-size: 16px; line-height: 22px; white-space: nowrap; flex: none; } .thead-r .tpr b { font-size: 16px; font-weight: 700; color: var(--text-2); }
.tnote { background: #f7f5fd; border-radius: 12px; padding: 12px; display: grid; gap: 12px; }
.tnote p { font-size: 14px; line-height: 20px; color: var(--text-2); }
.tnote .founder img { width: 32px; height: 32px; } .tnote .founder { gap: 10px; }
.opp-t p.pr { font-size: 16px; line-height: 20px; color: var(--text-2); } .opp-t .pr b { font-weight: 700; } .opp-t .pr s { color: var(--medium); }
.brand { margin-top: 23px; height: 62px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--text-2); }
.blogo { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 .5px #c6c6c6; display: grid; place-items: center; overflow: hidden; flex: none; }
.blogo img { width: 85%; display: block; }
.feats { padding: 32px 0; border-bottom: 1px solid var(--line); display: grid; gap: 24px; }
.feat { display: grid; grid-template-columns: 24px 1fr; gap: 16px; }
.feat b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--text-2); }
.feat b em { font-style: normal; color: var(--pink); }
.feat span { font-size: 14px; line-height: 19.25px; color: var(--soft); }
.hiw { padding: 24px 0; }
.hiw h3 { margin: 0 0 16px; font-size: 18px; line-height: 22px; font-weight: 700; letter-spacing: -.22px; color: var(--text-2); }
.hstep { display: grid; grid-template-columns: 32px 1fr; gap: 16px; padding-bottom: 24px; position: relative; }
.hstep:last-child { padding-bottom: 0; }
.hstep:not(:last-child)::before { content: ""; position: absolute; left: 15.5px; top: 34px; bottom: 2px; width: 1px; background: var(--line-2); }
.hstep i { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line-2); display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 600; color: var(--text-2); }
.hstep div { padding-top: 4px; }
.hstep b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--text-2); }
.hstep span { display: block; padding-top: 2px; font-size: 14px; line-height: 19.25px; color: var(--soft); }
.briefrow { width: 100%; height: 82px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.briefrow .ib { width: 38px; height: 38px; border-radius: 8px; background: #f7f7f7; display: grid; place-items: center; flex: none; }
.briefrow b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--text-2); }
.briefrow span { font-size: 14px; color: var(--soft); }
.briefrow .g { flex: 1; }
.foot { flex: none; background: #fff; box-shadow: 0 -.5px 0 var(--line), 0 4px 32px rgba(0,0,0,.04); padding: 20px 16px 0; }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.price b { font-size: 16px; font-weight: 600; color: var(--text-2); }
.price b span { font-weight: 400; }
.price small { display: block; margin-top: 2px; font-size: 12px; color: var(--soft); }
.cta { height: 48px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; letter-spacing: -.07px; display: grid; place-items: center; transition: background-color .12s; }
.cta:hover { background: var(--accent-press); }
.cta.w { width: 144px; flex: none; }
.cta.full { width: 100%; }
.cta:disabled { background: #d6cfea; cursor: default; }

/* ---------- flow steps ---------- */
.fhdr { flex: none; background: #fff; padding: 6px 16px 0; }
.fhdr-r { height: 52px; display: flex; align-items: center; gap: 10px; }
.fhdr-r .bk { width: 24px; height: 32px; display: grid; place-items: center; margin-left: -4px; }
.fhdr-r .lg { width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 .5px #c6c6c6; display: grid; place-items: center; overflow: hidden; flex: none; }
.fhdr-r .lg img { width: 84%; }
.fhdr-r .n { flex: 1; min-width: 0; }
.fhdr-r .n b { display: block; font-size: 14px; font-weight: 600; line-height: 18px; }
.fhdr-r .n span { font-size: 12px; color: var(--medium); line-height: 16px; }
.fhdr-r .vb { font-size: 14px; font-weight: 600; padding: 6px 0; }
.segs { display: flex; gap: 6px; padding: 10px 0 14px; }
.segs i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.segs i.on { background: var(--text); }
.fbody { padding: 24px 16px; display: grid; gap: 12px; align-content: start; min-height: 100%; }
.fbody h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -.2px; }
.fbody .lead { font-size: 14px; line-height: 20px; color: var(--medium); margin: -6px 0 8px; }
.opt { display: grid; grid-template-columns: 1fr 22px; gap: 12px; align-items: start; background: #fff; border-radius: 16px; padding: 16px; box-shadow: inset 0 0 0 1px var(--line); width: 100%; transition: box-shadow .12s; }
.opt.on { box-shadow: inset 0 0 0 1.5px var(--text); }
.opt b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; }
.opt span { display: block; margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--medium); }
.opt .rd { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #c6c6c6; margin-top: -1px; }
.opt.on .rd { box-shadow: inset 0 0 0 7px var(--text); }
.opt { cursor: pointer; }
.plink { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; line-height: 20px; margin-top: -4px; }
.plink:hover { text-decoration: underline; }
.thumbs { display: flex; gap: 12px; }
.th { position: relative; width: 96px; height: 126px; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); background: #eee; flex: none; }
.th > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th-x { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.th-add { width: 96px; height: 126px; border-radius: 12px; border: 1.5px dashed #c6c6c6; background: #fff; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--text); flex: none; }
.th-add span { font-size: 12px; font-weight: 600; color: var(--text); }
.th-add:hover { border-color: var(--text); }
.hint { font-size: 13px; line-height: 18px; color: var(--medium); margin: -4px 0 4px; }
.rtitle { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rtitle b { font-size: 15px; font-weight: 600; } .rtitle span { font-size: 13px; color: var(--medium); }
.card .lines { margin-top: 12px; }
.zone { width: 100%; background: #fff; border-radius: 16px; border: 1.5px dashed #c6c6c6; padding: 36px 16px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.zone:hover { border-color: var(--accent); }
.zone .zi { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-weak); display: grid; place-items: center; margin-bottom: 8px; color: var(--accent); }
.zone b { font-size: 15px; font-weight: 600; }
.zone span { font-size: 13px; color: var(--medium); }
.card { background: #fff; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px; }
.rcpt { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.paper { width: 64px; height: 84px; border-radius: 4px; background: #fbfaf6; box-shadow: 0 1px 4px rgba(0,0,0,.14); padding: 8px 7px; display: grid; gap: 4px; align-content: start; transform: rotate(-2deg); }
.paper i { display: block; height: 2px; border-radius: 1px; background: #c9c7c0; }
.paper i.m { width: 60%; margin: 0 auto 3px; height: 3px; background: #d2232a; }
.paper i.h { background: #f3d55b; height: 4px; }
.rcpt b { font-size: 15px; font-weight: 600; line-height: 20px; display: block; }
.rcpt span { font-size: 13px; color: var(--medium); line-height: 18px; display: block; }
.lines { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--weak); display: grid; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.lines div { display: flex; justify-content: space-between; color: var(--medium); }
.lines div.tot { color: var(--text); font-weight: 600; }
.tlink { font-size: 14px; font-weight: 600; color: var(--accent); justify-self: start; padding: 4px 0; }
.vid { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; }
.vid img { width: 64px; height: 84px; border-radius: 8px; object-fit: cover; display: block; }
.ok { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--green); }
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row2 + .row2 { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--weak); }
.row2 small { display: block; font-size: 12px; color: var(--medium); line-height: 16px; }
.row2 b { font-size: 15px; font-weight: 600; line-height: 20px; }
.copy { height: 32px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 600; background: #fff; flex: none; }
.copy:hover { background: #f7f7f8; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { height: 48px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: #fff; padding: 0 14px; font: 400 15px Inter, sans-serif; color: var(--text); width: 100%; }
.field input::placeholder { color: var(--subtle); }
.field input:focus { outline: 0; box-shadow: inset 0 0 0 1.5px var(--text); }
.uc .lead { margin: -8px 0 8px; }
.uc-h { display: flex; align-items: center; justify-content: space-between; }
.uc-h h2 { font-size: 16px; line-height: 20px; }
.uc-n { display: inline-flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; color: var(--medium); font-variant-numeric: tabular-nums; }
.uc-item { background: #fff; box-shadow: inset 0 0 0 .5px var(--line); border-radius: 16px; height: 108px; padding: 8px 12px 8px 8px; display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.uc-th { width: 70px; height: 100%; border-radius: 8px; object-fit: cover; flex: none; background: #c69769; }
.uc-c { flex: 1; min-width: 0; display: grid; gap: 8px; }
.uc-top { display: flex; align-items: center; justify-content: space-between; }
.uc-chip { background: #f5f5f5; box-shadow: inset 0 0 0 1px var(--weak); border-radius: 52px; padding: 4px 8px; font-size: 12px; font-weight: 500; line-height: 15px; }
.uc-cap { font-size: 12px; line-height: 15px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.at { color: #0c8ee9; } .hash { color: var(--accent); }
.uc-zone { width: 100%; height: 120px; background: #fff; border: 1px dashed var(--medium); border-radius: 12px; display: grid; place-content: center; justify-items: center; gap: 12px; font-size: 13px; font-weight: 500; }
.ac { padding: 16px; display: grid; gap: 12px; }
.ac-card { background: #fff; box-shadow: inset 0 0 0 .5px var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; width: 100%; position: relative; }
.ac-card > b { font-size: 14px; line-height: 16px; font-weight: 600; }
.ac-tiles { display: flex; gap: 12px; margin-top: 8px; }
.ac-tile { width: 95.67px; height: 95.67px; border-radius: 8px; box-shadow: inset 0 0 0 .5px var(--line); background: var(--weak); position: relative; overflow: hidden; display: grid; place-items: center; }
.ac-tile > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ac-act { width: 20px; height: 20px; border-radius: 12px; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.08); display: grid; place-items: center; position: absolute; top: 4px; right: 4px; }
.ac-act.c { position: static; }
.ac-type span { font-size: 14px; color: var(--medium); line-height: 17px; }
.ac-type img { position: absolute; right: 16px; top: 50%; margin-top: -8px; }
.ac-sub { font-size: 14px; line-height: 17px; color: var(--medium); } .ac-sub strong { font-weight: 600; }
.ac-chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 16px 0 12px; border-radius: 52px; font-size: 13px; font-weight: 500; color: var(--medium); box-shadow: inset 0 0 0 1px var(--line); margin: 4px 0; }
.ac-chip img { opacity: 0; width: 0; }

function render() {
  const base = S.s === 2 ? 1 : S.s;
  const sheet = S.s === 2 ? 'join' : S.sheet;
  const el = document.getElementById('device');
  const keep = el.querySelector('.scroll')?.scrollTop || 0, same = el.dataset.s === String(base);
  el.dataset.s = base;
  el.innerHTML = SCREENS[base]() + (sheet ? `<div class="scrim" data-sheet=""></div><div class="sheet${sheet === 'brief' ? ' sheet--full' : ''}" role="dialog" aria-modal="true"><div class="grab"><img src="m/pull.svg" width="43" height="3" alt=""></div>${SHEETS[sheet]()}<div class="home"></div></div>` : '') + '<div class="toast" id="toast" role="status"></div>';
  if (same) { const sc = el.querySelector('.scroll'); if (sc) sc.scrollTop = keep; if (sheet) el.querySelectorAll('.scrim, .sheet').forEach(n => n.style.animation = 'none'); }
  document.getElementById('rail').innerHTML = NAMES.map(([n, isNew], i) => `<button class="s" data-jump="${i}" aria-current="${S.s === i}"><span>${i + 1}</span>${n}${isNew ? '<em>new</em>' : ''}</button>`).join('');
}
function openAdd() { const left = TYPES.filter(t => !S.items.some(i => i.type === t)); S.add = { file: false, type: left[0] || '' }; }
function toast(m) { const t = document.getElementById('toast'); if (!t) return; t.textContent = m; requestAnimationFrame(() => t.classList.add('show')); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

document.addEventListener('click', (e) => {
  const q = (s) => e.target.closest(s); let el;
  if ((el = q('[data-jump]'))) { const n = +el.dataset.jump; S = fresh(); S.s = n; if (n >= 3) S.join = [1,1,1,1]; if (n >= 4) S.how = 'online'; if (n >= 6) S.rc = 1; if (n >= 7) { S.vid = [1,1,1,1,1]; S.items = [{ type: 'Instagram Reel' }, { type: 'Instagram Story' }]; } if (n >= 9) S.links = ['instagram.com/reel/DfQ2x9', 'instagram.com/stories/maya.glows', '']; render(); return; }
  if (q('[data-reset]')) { S = fresh(); render(); return; }
  if ((el = q('[data-go]'))) { if (el.disabled) return; S.s = +el.dataset.go; S.sheet = null; S.add = null; const m = el.dataset.toast; render(); if (m) toast(m); return; }
  if (q('[data-back]') && S.add) { S.add = null; render(); return; }
  if (q('[data-back]')) { S.s = S.s === 3 ? 1 : S.s === 8 ? 6 : S.s - 1; S.sheet = null; render(); return; }
  if ((el = q('[data-ck]'))) { const [k, i] = el.dataset.ck.split(':'); S[k][+i] = S[k][+i] ? 0 : 1; render(); return; }
  if (q('.olink')) return;
  if ((el = q('[data-how]'))) { S.how = el.dataset.how; render(); return; }
  if ((el = q('[data-sheet]'))) { const v = el.dataset.sheet; if (v === 'join') S.s = 2; else if (S.s === 2 && !v) S.s = 1; else S.sheet = v || null; render(); return; }
  if ((el = q('[data-act]'))) { const a = el.dataset.act;
    if (a === 'receipt') { S.rc = Math.min(2, S.rc + 1); render(); }
    else if (a === 'rx') { S.rc = Math.max(0, S.rc - 1); render(); }
    else if (a === 'add') { if (S.vid.every(Boolean)) openAdd(); else S.sheet = 'video'; render(); }
    else if (a === 'checked') { S.sheet = null; openAdd(); render(); }
    else if (a === 'add-x') { S.add = null; render(); }
    else if (a === 'add-file') { S.add.file = true; render(); }
    else if (a === 'add-file-x') { S.add.file = false; render(); }
    else if (a.startsWith('type:')) { S.add.type = a.slice(5); S.sheet = null; render(); }
    else if (a === 'add-save') { if (!addOk()) return; S.items.push({ type: S.add.type }); S.add = null; render(); }
    else if (a.startsWith('del:')) { S.items.splice(+a.slice(4), 1); render(); }
    else if (a === 'more') { S.extra = 1; render(); }
    return; }
  if ((el = q('[data-toast]'))) toast(el.dataset.toast);
});
document.addEventListener('input', (e) => { const k = e.target.dataset.link; if (k !== undefined) { S.links[+k] = e.target.value; const b = document.getElementById('submit'); if (b) b.disabled = !postOk(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.sheet || S.s === 2)) { if (S.s === 2) S.s = 1; S.sheet = null; render(); } if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.how) { e.preventDefault(); S.how = e.target.dataset.how; render(); } });
render();
